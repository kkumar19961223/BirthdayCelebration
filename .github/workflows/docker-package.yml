name: Build and package Docker image

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker buildx build --platform linux/amd64 --load --tag birthday-celebration:${GITHUB_SHA} .

      - name: Save image as archive
        run: docker save birthday-celebration:${GITHUB_SHA} --output birthday-celebration-${GITHUB_SHA}.tar

      - name: Upload packaged image
        uses: actions/upload-artifact@v4
        with:
          name: birthday-celebration-docker-${{ github.sha }}
          path: birthday-celebration-${{ github.sha }}.tar
          if-no-files-found: error
          retention-days: 14
